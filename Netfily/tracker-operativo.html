function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
}

// Formateo numérico estilo español: 26.444 / 1.234,56
function fmt(v, dec) {
  dec = dec || 0;
  if (v === null || v === undefined) return '\u2014';
  var n = Number(v);
  if (isNaN(n)) return v !== '' ? String(v) : '\u2014';
  return n.toLocaleString('de-DE', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}

function pstr(v, dec) {
  dec = dec == null ? 1 : dec;
  return (v >= 0 ? '+' : '') + Number(v).toFixed(dec) + '%';
}

function pcls(v) { return Number(v) >= 0 ? 'pos' : 'neg'; }

function bar(w, cls) {
  cls = cls || 'bar-g';
  return '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + Number(w).toFixed(1) + '%"></div></div>';
}

function bdg(text, cls) {
  return '<span class="badge ' + (cls || 'bgr') + '">' + (text || '\u2014') + '</span>';
}

/* ═══════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════ */
function renderPm() {
  var pm = DATA.pm;
  var totUds = pm.menu_uds + pm.carta_uds;

  // ── KPIs: Menú vs Carta ────────────────────────────────────────────────────
  var pctM  = pm.pct_menu_uds;
  var pctC  = (100 - pctM).toFixed(1);
  var h = '<div class="kpi-row">'
    + '<div class="kpi"><div class="kpi-val">' + fmt(pm.menu_uds) + '</div><div class="kpi-lbl">Menús vendidos</div><div class="kpi-sub">' + pctM.toFixed(1) + '% uds · ' + pm.pct_menu_imp.toFixed(1) + '% importe</div></div>'
    + '<div class="kpi"><div class="kpi-val">' + fmt(pm.carta_uds) + '</div><div class="kpi-lbl">Productos carta</div><div class="kpi-sub">' + pctC + '% uds · ' + (100 - pm.pct_menu_imp).toFixed(1) + '% importe</div></div>'
    + '<div class="kpi ' + (pm.mg_medio_menu  != null ? 'ok' : '') + '"><div class="kpi-val">' + (pm.mg_medio_menu  != null ? pm.mg_medio_menu  + '%' : '—') + '</div><div class="kpi-lbl">Margen medio menú</div></div>'
    + '<div class="kpi ' + (pm.mg_medio_carta != null ? 'ok' : '') + '"><div class="kpi-val">' + (pm.mg_medio_carta != null ? pm.mg_medio_carta + '%' : '—') + '</div><div class="kpi-lbl">Margen medio carta</div></div>'
    + '</div>';

  // ── Insight automático ────────────────────────────────────────────────────
  h += '<div class="alert info" style="margin-bottom:14px">💡 ' + pm.insight + '</div>';

  // ── Evolución mensual de menús ────────────────────────────────────────────
  var maxMesUds = Math.max.apply(null, pm.menus_mes.map(function(m){return m.uds;}));
  h += '<div class="sec" style="margin-bottom:14px"><div class="sec-title">Evolución mensual de menús vendidos</div>'
     + '<div class="tbl-wrap"><table>'
     + '<thead><tr><th>Mes</th><th class="tr">Menús</th><th class="tr">Importe €</th><th class="tr">€/menú</th><th>Tendencia</th></tr></thead><tbody>';
  var prevUds = 0;
  pm.menus_mes.forEach(function(m) {
    var ticketM = m.uds ? (m.importe / m.uds).toFixed(2) : '—';
    var tend = '';
    if (prevUds > 0) {
      var diff = m.uds - prevUds;
      var pct  = (diff / prevUds * 100).toFixed(1);
      tend = '<span class="' + (diff >= 0 ? 'pos' : 'neg') + '">' + (diff >= 0 ? '▲' : '▼') + ' ' + Math.abs(pct) + '%</span>';
    }
    var bw = maxMesUds ? (m.uds / maxMesUds * 100).toFixed(1) : 0;
    h += '<tr><td class="fw">' + m.mes + '</td>'
       + '<td class="tr fm">' + fmt(m.uds) + '</td>'
       + '<td class="tr fm">' + fmt(m.importe) + '</td>'
       + '<td class="tr">'    + ticketM + '€</td>'
       + '<td style="min-width:120px">' + bar(bw, 'bar-g') + ' ' + tend + '</td></tr>';
    prevUds = m.uds;
  });
  h += '</tbody></table></div></div>';

  // ── Barras: Menú vs Carta (visual split) ──────────────────────────────────
  var wM = pm.pct_menu_imp;
  var wC = (100 - wM);
  h += '<div class="sec" style="margin-bottom:14px">'
     + '<div class="sec-title">Distribución importe: Menú vs Carta</div>'
     + '<div style="display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:8px">'
     + '<div style="width:' + wM.toFixed(1) + '%;background:#86efac;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#15803d">' + (wM > 8 ? wM.toFixed(1) + '% Menú' : '') + '</div>'
     + '<div style="width:' + wC.toFixed(1) + '%;background:#93c5fd;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1d4ed8">' + (wC > 8 ? wC.toFixed(1) + '% Carta' : '') + '</div>'
     + '</div></div>';

  // ── Tablas: Menús + Familias carta ────────────────────────────────────────
  h += '<div class="two-col">';

  // Tabla menús
  h += '<div class="sec"><div class="sec-title">Menús vendidos (unidad real)</div><div class="tbl-wrap"><table>'
     + '<thead><tr><th>#</th><th>Menú</th><th class="tr">Uds</th><th class="tr">% Uds</th><th class="tr">% Imp.</th><th>Vol.</th></tr></thead><tbody>';
  pm.menus.forEach(function(m) {
    h += '<tr><td class="tc">' + m.rank + '</td>'
       + '<td class="fw">'     + m.nombre + '</td>'
       + '<td class="tr fm">'  + fmt(m.uds) + '</td>'
       + '<td class="tr">'     + m.pct.toFixed(1) + '%</td>'
       + '<td class="tr">'     + m.pct_imp.toFixed(1) + '%</td>'
       + '<td>'                + bar(m.bar_w, 'bar-g') + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  // Tabla familias (menú + carta)
  h += '<div class="sec"><div class="sec-title">Familias (excl. componentes menú)</div><div class="tbl-wrap"><table>'
     + '<thead><tr><th>#</th><th>Familia</th><th class="tr">Uds</th><th class="tr">% total</th><th>Tipo</th><th>Peso</th></tr></thead><tbody>';
  pm.top_fams.forEach(function(f) {
    var tcls = f.tipo === 'menu' ? 'bg' : 'bb';
    var tlbl = f.tipo === 'menu' ? 'Menú' : 'Carta';
    h += '<tr><td class="tc">' + f.rank + '</td>'
       + '<td class="fw">'     + f.nombre + '</td>'
       + '<td class="tr fm">'  + fmt(f.uds) + '</td>'
       + '<td class="tr">'     + f.pct.toFixed(1) + '%</td>'
       + '<td>'                + bdg(tlbl, tcls) + '</td>'
       + '<td>'                + bar(f.bar_w, f.tipo === 'menu' ? 'bar-g' : 'bar-b') + '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  h += '</div>'; // two-col

  // Tabla top productos carta
  h += '<div class="sec"><div class="sec-title">Top 20 productos carta (sin componentes menú)</div><div class="tbl-wrap"><table>'
     + '<thead><tr><th>#</th><th>Producto</th><th class="tr">Uds</th><th class="tr">% total</th><th>Volumen</th></tr></thead><tbody>';
  pm.carta.forEach(function(p) {
    h += '<tr><td class="tc">' + p.rank + '</td>'
       + '<td class="fw">'     + p.nombre + '</td>'
       + '<td class="tr fm">'  + fmt(p.uds) + '</td>'
       + '<td class="tr">'     + p.pct.toFixed(1) + '%</td>'
       + '<td>'                + bar(p.bar_w, 'bar-b') + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  document.getElementById('page-pm').innerHTML = h;
}

     + '<div class="kpi ' + (pl.e_mar  < 0 ? 'bad' : 'ok') + '"><div class="kpi-val">' + fmt(pl.e_mar)  + '€</div><div class="kpi-lbl">EBITDA ' + L.m1 + '</div><div class="kpi-sub">'   + pl.ebitda_mar_pct.toFixed(1)  + '%</div></div>'
     + '<div class="kpi ' + (pl.e_feb  < 0 ? 'bad' : 'ok') + '"><div class="kpi-val">' + fmt(pl.e_feb)  + '€</div><div class="kpi-lbl">EBITDA ' + L.m2 + '</div><div class="kpi-sub">'   + (pl.v_feb ? (pl.e_feb/pl.v_feb*100).toFixed(1) : 0) + '%</div></div>'
     + '<div class="kpi ' + (pl.e_acum < 0 ? 'bad' : 'ok') + '"><div class="kpi-val">' + fmt(pl.e_acum) + '€</div><div class="kpi-lbl">EBITDA Acumulado ' + L.acum + '</div><div class="kpi-sub">' + pl.ebitda_acum_pct.toFixed(1) + '%</div></div>'
     + '<div class="kpi"><div class="kpi-val">'   + fmt(pl.v_mar)  + '€</div><div class="kpi-lbl">Ventas ' + L.m1 + '</div></div>'
     + '<div class="kpi"><div class="kpi-val">'   + fmt(pl.v_acum) + '€</div><div class="kpi-lbl">Ventas ' + L.acum + '</div></div>'
     + '</div>';

  var meses = (L.meses && L.meses.length) ? L.meses : [L.m3, L.m2, L.m1];
  var nCols = 1 + meses.length * 2 + 2;

  h += '<div class="sec"><div class="sec-title">P&amp;L EBITDA — ' + L.m1 + ' 2026 (mes más reciente) · Fuente: Yurest + Tickets + Caja 1</div><div class="tbl-wrap"><table>'
     + '<thead><tr><th style="width:220px">Concepto</th>';
  meses.forEach(function(m, i) {
    var isMar = (i === meses.length - 1);
    h += '<th class="tr' + (isMar ? ' mar' : '') + '">' + m + ' €</th>'
       + '<th class="tr pc' + (isMar ? ' mar' : '') + '">%</th>';
  });
  h += '<th class="tr">Acum. ' + L.acum + ' €</th><th class="tr pc">%</th>'
     + '</tr></thead><tbody>';

  function plCell(mc) {
    return '<td class="tr fm' + (mc.v < 0 ? ' neg' : '') + '">' + fmt(mc.v) + '</td>'
         + '<td class="tr pc">' + mc.p.toFixed(1) + '%</td>';
  }

  pl.rows.forEach(function(row) {
    if (row.section) {
      h += '<tr class="pl-section"><td colspan="' + nCols + '">' + row.label + '</td></tr>';
      return;
    }
    var rowCls = '';
    var refCol = row.cols ? row.cols[row.cols.length - 1] : row.mar;
    if (row.bold) {
      rowCls = 'pl-bold ' + (refCol.v < 0 ? 'neg-row' : 'pos-row');
    } else if (row.subtotal) {
      rowCls = 'pl-sub';
    }
    var lbl = row.bold ? '<strong>' + row.label + '</strong>' : row.label;

    var colsData = row.cols || [row.ene, row.feb, row.mar];

    h += '<tr' + (rowCls ? ' class="' + rowCls + '"' : '') + '>'
       + '<td>' + lbl + '</td>'
       + colsData.map(function(mc) { return plCell(mc); }).join('')
       + plCell(row.acum)
       + '</tr>\n';
  });

  h += '</tbody></table></div></div>';
  document.getElementById('page-pl').innerHTML = h;
}

/* ═══════════════════════════════════════════════════════════════════
   INICIALIZACIÓN
   ═══════════════════════════════════════════════════════════════════ */
async function triggerUpdate() {
  const btn = document.getElementById('btn-update');
  btn.disabled = true;
  btn.textContent = '⏳ Lanzando...';
  try {
    const res = await fetch('/.netlify/functions/trigger-update', { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      btn.textContent = '✓ Lanzado — listo en ~2 min';
      setTimeout(() => { btn.disabled = false; btn.textContent = '↻ Actualizar datos'; }, 120000);
    } else {
      btn.textContent = '✗ Error';
      setTimeout(() => { btn.disabled = false; btn.textContent = '↻ Actualizar datos'; }, 4000);
    }
  } catch {
    btn.textContent = '✗ Error de red';
    setTimeout(() => { btn.disabled = false; btn.textContent = '↻ Actualizar datos'; }, 4000);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  // Header subtitle
  document.getElementById('header-sub').textContent =
    'Facturado ' + DATA.meta.periodo + ' (neto+C1): ' + fmt(DATA.fac.total_real) + '€'
    + '  |  ' + DATA.fac.total_dias + ' dias operativos'
    + '  |  Generado: ' + DATA.meta.generado;

  // Render all pages
  renderFac();
  renderPer();
  renderEv();
  renderAl();
  renderPm();
  renderOm();
  renderPl();
});
</script>
