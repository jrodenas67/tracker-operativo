name: Actualizar Tracker Operativo

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests openpyxl pypdf --quiet

      - name: Actualizar facturacion (cierres de caja)
        continue-on-error: true
        env:
          MS_TENANT_ID:        ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:        ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET:    ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_SHARE_URL:  ${{ secrets.ONEDRIVE_SHARE_URL }}
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python update_facturacion.py

      - name: Generar tracker-operativo.html
        env:
          MS_TENANT_ID:       ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:       ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET:   ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
          YUREST_EMAIL:       ${{ secrets.YUREST_EMAIL }}
          YUREST_PASSWORD:    ${{ secrets.YUREST_PASSWORD }}
        run: python generar_tracker.py

      - name: Preparar carpeta deploy
        run: |
          cp tracker-operativo.html Netfily/index.html
          cp tracker-operativo.html Netfily/tracker-operativo.html
          # Netfily/_worker.js (Cloudflare Pages Function del botón "Actualizar datos") ya está
          # en el repo; NO copiar netlify.toml ni netlify/functions (obsoletos e interfieren
          # con la compilación del Worker de Cloudflare).
          rm -rf Netfily/netlify Netfily/netlify.toml

      # Netlify desactivado (deploy roto por token/CLI, ver ref_pipelines_kpi_tracker_verificacion.md).
      # tracker-operativo-taperia.pages.dev (Cloudflare) es ahora el sitio en uso.

      - name: Deploy a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy Netfily \
            --project-name tracker-operativo-taperia \
            --branch main \
            --commit-message "Auto-update $(date +'%d/%m/%Y %H:%M')"
